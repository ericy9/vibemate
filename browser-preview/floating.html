<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeMate · 桌面陪伴</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#28493f;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#e5e9df}header{display:flex;align-items:center;justify-content:space-between;padding:25px 5vw;border-bottom:1px solid #ffffff70}.wordmark{font-weight:750;letter-spacing:-.5px;font-size:20px}.tag{font-size:11px;color:#7c8f80}main{min-height:calc(100vh - 90px);position:relative;overflow:hidden;background:radial-gradient(ellipse at 25% 25%,#faf9ed 0,transparent 60%),radial-gradient(ellipse at 90% 95%,#a5c4b1 0,transparent 60%)}.intro{position:relative;padding:70px 6vw 20px;max-width:630px;z-index:1}.eyebrow{font-size:11px;letter-spacing:3px;color:#889b88}h1{font-size:clamp(30px,4vw,52px);font-weight:500;letter-spacing:-2px;line-height:1.3;margin:18px 0}.intro p{font-size:14px;line-height:1.9;color:#7b8f80;max-width:390px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}button,a{font:inherit}button{border:1px solid #b9cdbc;background:#f7fbf270;color:#5e7c68;border-radius:9px;padding:7px 13px;font-size:12px;cursor:pointer}button:hover,button.active{background:#2c7c65;color:white;border-color:#2c7c65}a{color:#537966;text-decoration:none;font-size:12px}.view-controls{display:flex;gap:14px;align-items:center;margin-top:22px}.view-controls button{border:0;padding:0;background:transparent;color:#567d66}.desktop-stage{position:absolute;right:5vw;top:44px;width:650px;height:650px}.window{position:absolute;border:0;background:transparent}.panel-wrap{position:absolute;left:40px;bottom:40px;width:236px;height:52px;transition:width .15s,height .15s}.panel-wrap iframe{width:100%;height:100%;display:block}.pet-wrap{position:absolute;right:0;bottom:15px;width:320px;height:340px}.pet-wrap iframe{width:320px;height:340px}.grab{position:absolute;top:10px;left:11px;width:225px;height:52px;z-index:2;cursor:grab;border-radius:20px 0 0 0;touch-action:none}.pet-wrap .grab{top:40px;left:35px;width:230px;height:210px}.grab:active{cursor:grabbing}.caption{position:absolute;right:28px;bottom:0;font-size:11px;color:#6d8a76}.demo-note{position:relative;padding:15px 6vw;color:#819481;font-size:11px;max-width:490px}dialog{padding:0;border:1px solid #506459;border-radius:16px;width:min(1000px,92vw);height:85vh;background:#111827}dialog::backdrop{background:#20372e70;backdrop-filter:blur(5px)}dialog>button{position:absolute;right:18px;top:12px;z-index:2;background:white;color:#294d3a}dialog iframe{width:100%;height:100%;border:0}[hidden]{display:none!important}@media(min-width:1250px){.intro{padding-top:110px}}@media(max-width:1100px){.intro{padding-top:30px}.desktop-stage{position:relative;margin:0 auto;right:auto;top:0;height:610px}.demo-note{max-width:none}}@media(max-width:680px){.desktop-stage{width:100%;height:840px}.panel-wrap{right:calc(50% - 190px)}.pet-wrap{left:calc(50% - 160px);bottom:0}.caption{bottom:4px}.intro{padding:24px}header{padding:20px 24px}}
</style></head><body><header><span class="wordmark">VibeMate<span style="color:#8ba68f"> / companion</span></span><span class="tag">桌面体验预览 · 模拟数据</span></header><main>
<section class="intro"><span class="eyebrow">A LITTLE COMPANY, A LITTLE CLARITY</span><h1>任务在进行。<br>你不必一直盯着。</h1><p>桌宠陪伴，小窗关注。<br>只在需要的时候，轻轻提醒你。</p>
<div class="toolbar" aria-label="演示场景"><button data-mode="mixed" class="active">需要你处理</button><button data-mode="working">专心工作</button><button data-mode="completed">任务完成</button><button data-mode="failed">遇到问题</button></div>
<div class="view-controls"><button id="toggle-panel">隐藏监控窗</button><button id="toggle-pet">隐藏桌宠</button><a href="#" id="dashboard">完整面板 ↗</a></div></section>
<div class="desktop-stage" id="stage"><div class="panel-wrap" id="panel-wrap"><iframe class="window" id="float-frame" title="悬浮监控窗"></iframe></div><div class="pet-wrap" id="pet-wrap"><iframe class="window" id="pet-frame" title="现有动画桌宠"></iframe><div class="grab" aria-hidden="true" title="拖动桌宠"></div></div><span class="caption">点击胶囊展开 · 移开 3 秒自动收起 · 拖到左右边缘吸附</span></div>
<p class="demo-note" id="demo-feedback" role="status"></p></main><dialog id="dashboard-dialog"><button id="close-dashboard">关闭面板 ×</button><iframe title="完整 Dashboard" id="dashboard-frame"></iframe></dialog>
<script src="/monitor-mock.js"></script><script src="/floating.js"></script></body></html>
