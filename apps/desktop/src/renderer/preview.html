<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMate Monitor</title>
    <link rel="stylesheet" href="./preview.css">
  </head>
  <body>
    <main id="monitor" data-mode="capsule">
      <button id="capsule" class="capsule" type="button" aria-label="展开任务监控">
        <span class="capsule-dot"></span>
        <span class="capsule-metrics">
          <span class="metric working"><i></i><b id="capsule-working">0</b></span>
          <span class="metric attention"><i></i><b id="capsule-attention">0</b></span>
          <span class="metric completed"><i></i><b id="capsule-completed">0</b></span>
        </span>
        <span id="capsule-text" class="capsule-text"></span>
        <span id="capsule-toast" class="capsule-toast" hidden><span id="capsule-toast-text"></span><b id="capsule-toast-extra"></b></span>
      </button>

      <section id="expanded" class="expanded" hidden>
        <header id="expanded-header">
          <span id="headline"></span>
          <span id="connection" class="connection"></span>
        </header>
        <div id="tasks" aria-label="任务列表"></div>
        <p id="feedback" role="status" aria-live="polite"></p>
        <footer>
          <button id="open-settings" type="button" title="环境与偏好设置">设置</button>
          <span class="spacer"></span>
          <button id="collapse" type="button" title="收起为胶囊">收起</button>
          <button id="hide" type="button" title="隐藏到托盘">隐藏</button>
        </footer>
      </section>
    </main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
